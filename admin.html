<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Fancy Unlimited Collection</title><style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f4f6f9;color:#111827}.panel{background:#fff;max-width:1050px;margin:15px auto;padding:18px;border-radius:14px;border:1px solid #ddd}.login{max-width:400px;margin-top:60px}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}label{font-weight:bold;font-size:13px;display:block;margin-bottom:4px}input,textarea{width:100%;padding:11px;border:1px solid #ccd2da;border-radius:9px}textarea{min-height:90px}.btn{padding:10px 14px;border:0;border-radius:9px;background:#111827;color:#fff;font-weight:bold;margin-top:10px}.green{background:#16a34a}.red{background:#dc2626}.product{border:1px solid #ddd;border-radius:10px;padding:10px;margin-top:10px}.product img{width:75px;height:90px;object-fit:cover;border-radius:7px}.photos{display:flex;gap:7px;overflow:auto}.muted{color:#667085;font-size:13px}</style><script src="data.js"></script></head><body><div id="login" class="panel login"><h2>Admin Login</h2><label>Email</label><input id="em" type="email"><label>Password</label><input id="pw" type="password"><button class="btn" style="width:100%" onclick="doLogin()">Login</button><p id="err" class="muted"></p></div><div id="app" class="hidden"><div class="panel"><h1>Fancy Unlimited Collection - Admin</h1><a href="index.html">View Store</a> <button class="btn" onclick="logout()">Logout</button></div><div class="panel"><h2>Profile Settings</h2><div class="grid"><div><label>Cover Photo</label><input id="cf" type="file" accept="image/*"><img id="cp" style="width:100%;height:130px;object-fit:cover"></div><div><label>Profile Photo</label><input id="pf" type="file" accept="image/*"><img id="pp" style="width:90px;height:90px;border-radius:50%;object-fit:cover"></div><div><label>Website Name</label><input id="sn"></div><div><label>WhatsApp</label><input id="wa"></div><div style="grid-column:1/-1"><label>Bio</label><textarea id="bi"></textarea></div></div><button class="btn green" onclick="settingsSave()">Save Settings</button></div><div class="panel"><h2>Add Product</h2><div class="grid"><div><label>Product Name / Number</label><input id="pt"></div><div><label>Price</label><input id="pr" type="number" value="560"></div><div style="grid-column:1/-1"><label>4-line Design Description</label><textarea id="pd"></textarea></div><div style="grid-column:1/-1"><label>1-10 Photos</label><input id="files" type="file" accept="image/*" multiple></div></div><button class="btn green" onclick="add()">Add Product</button></div><div class="panel"><h2>Products</h2><input id="search" placeholder="Search..." oninput="draw()"><div id="list"></div></div></div><script>const DB='FUC_STORE_V2';let c,p=[];function db(){return new Promise((a,b)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)})}async function get(k){let d=await db();return new Promise(a=>{let r=d.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>a(r.result)})}async function put(k,v){let d=await db();return new Promise(a=>{let r=d.transaction('kv','readwrite').objectStore('kv').put(v,k);r.onsuccess=a})}async function hash(s){let b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}function fd(f){return new Promise((a,b)=>{let r=new FileReader();r.onload=()=>a(r.result);r.onerror=b;r.readAsDataURL(f)})}async function doLogin(){const emEl=document.getElementById('em'),pwEl=document.getElementById('pw'),errEl=document.getElementById('err');c=await get('settings')||structuredClone(window.FUC);let e=emEl.value.trim().toLowerCase(),h=await hash(pwEl.value),ok=e===c.admin.email.toLowerCase()&&h===c.admin.passwordHash;if(!ok){let es=c.admin.extraEmails||[],hs=c.admin.extraPasswordHashes||[];for(let i=0;i<es.length;i++)if(e===es[i].toLowerCase()&&h===hs[i])ok=true}if(ok){sessionStorage.FUC_ADMIN='1';await show()}else errEl.textContent='Invalid email or password.'}async function show(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');c=await get('settings')||structuredClone(window.FUC);p=await get('products')||[];fill();draw()}function logout(){sessionStorage.removeItem('FUC_ADMIN');location.reload()}function fill(){document.getElementById('cp').src=c.coverImage;document.getElementById('pp').src=c.profileImage;document.getElementById('sn').value=c.siteName;document.getElementById('wa').value=c.whatsapp;document.getElementById('bi').value=c.bio}async function settingsSave(){const cfEl=document.getElementById('cf'),pfEl=document.getElementById('pf'),snEl=document.getElementById('sn'),waEl=document.getElementById('wa'),biEl=document.getElementById('bi');if(cfEl.files[0])c.coverImage=await fd(cfEl.files[0]);if(pfEl.files[0])c.profileImage=await fd(pfEl.files[0]);c.siteName=snEl.value.trim()||'Fancy Unlimited Collection';c.whatsapp=waEl.value.replace(/\D/g,'');c.bio=biEl.value;await put('settings',c);fill();alert('Settings saved.')}async function add(){const filesEl=document.getElementById('files'),ptEl=document.getElementById('pt'),prEl=document.getElementById('pr'),pdEl=document.getElementById('pd');let fs=[...filesEl.files];if(!fs.length)return alert('Select photos.');if(fs.length>10)return alert('Maximum 10 photos.');let imgs=[];for(let f of fs)imgs.push({src:await fd(f)});p.unshift({id:'P'+Date.now(),title:ptEl.value.trim()||'Product '+(p.length+1),price:Number(prEl.value)||560,description:pdEl.value.trim()||`Beautiful design\nSoft fiber cotton fabric\nComfortable fitting\nAvailable in all sizes`,images:imgs});await put('products',p);filesEl.value='';ptEl.value='';pdEl.value='';draw();alert('Product added.')}function draw(){let q=document.getElementById('search').value.toLowerCase();let a=p.filter(x=>(x.id+' '+x.title).toLowerCase().includes(q));document.getElementById('list').innerHTML=a.map(x=>`<div class="product"><b>${x.title}</b> · ₹${x.price}<div class="photos">${x.images.map((im,i)=>`<div><img src="${im.src}"><br><button class="btn red" onclick="delPhoto('${x.id}',${i})">Delete</button></div>`).join('')}</div><input id="add_${x.id}" type="file" accept="image/*" multiple><button class="btn" onclick="angles('${x.id}')">＋ Add Photos</button><button class="btn red" onclick="del('${x.id}')">Delete Product</button></div>`).join('')||'<p class="muted">No products yet.</p>'}async function angles(id){let x=p.find(a=>a.id===id),f=document.getElementById('add_'+id),fs=[...f.files];if(x.images.length+fs.length>10)return alert('Maximum 10 photos per product.');for(let z of fs)x.images.push({src:await fd(z)});await put('products',p);draw()}async function delPhoto(id,i){let x=p.find(a=>a.id===id);if(x.images.length<=1)return alert('Keep at least one photo.');x.images.splice(i,1);await put('products',p);draw()}async function del(id){if(confirm('Delete product?')){p=p.filter(x=>x.id!==id);await put('products',p);draw()}}if(sessionStorage.FUC_ADMIN==='1')show();</script></body></html>
