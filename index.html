<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fancy Unlimited Collection</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;font-family:Arial;color:#111827}.cover{height:270px;background:center/cover no-repeat;position:relative}.admin{position:absolute;right:16px;top:12px;color:#fff}.head{max-width:1100px;margin:-65px auto 0;position:relative;padding:0 16px;color:#fff}.top{display:flex;align-items:end;gap:16px}.avatar{width:130px;height:130px;border-radius:50%;border:6px solid white;object-fit:cover}.name{font-size:29px;font-weight:800}.bio{padding:15px 0;line-height:1.5}.tools,.grid{max-width:1100px;margin:auto;padding:0 16px}.tools{margin-top:15px}.tools input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px;padding-top:15px;padding-bottom:40px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;overflow:hidden}.main{width:100%;aspect-ratio:4/5;object-fit:cover;cursor:zoom-in}.thumbs{display:flex;gap:5px;overflow:auto;padding:7px}.thumbs img{width:50px;height:60px;object-fit:cover;border-radius:6px}.info{padding:11px}.price{font-size:19px;font-weight:800}.line{margin-top:5px;font-weight:600}.desc{white-space:pre-line;margin-top:6px;color:#475467;line-height:1.4}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}.btn{border:0;border-radius:9px;padding:10px;font-weight:700;background:#eef1f5}.order{background:#16a34a;color:white}.share{grid-column:1/-1}.modal{display:none;position:fixed;inset:0;background:#000c;z-index:5;align-items:center;justify-content:center}.modal.open{display:flex}.modal img{max-width:95%;max-height:92%}@media(max-width:600px){.cover{height:205px}.avatar{width:105px;height:105px}.name{font-size:21px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));padding:0 8px 30px;gap:9px}.info{padding:8px}}</style><script src="data.js"></script></head><body><div id="cover" class="cover"><a class="admin" href="admin.html">Admin Login</a></div><div class="head"><div class="top"><img id="avatar" class="avatar"><div class="name" id="site"></div></div><div id="bio" class="bio"></div></div><div class="tools"><input id="search" placeholder="Search products..."></div><main id="grid" class="grid"></main><div id="modal" class="modal" onclick="this.classList.remove('open')"><img id="zoom"></div><script>const DB='FUC_STORE_V2';function db(){return new Promise((a,b)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)})}async function get(k){let d=await db();return new Promise(a=>{let r=d.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>a(r.result)})}let c,p=[];async function init(){c=await get('settings')||FUC;p=await get('products')||c.products||[];cover.style.backgroundImage=`url("${c.coverImage}")`;avatar.src=c.profileImage;site.textContent=c.siteName;bio.textContent=c.bio;render()}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){let q=search.value.toLowerCase(),a=p.filter(x=>(x.title+' '+x.description).toLowerCase().includes(q));grid.innerHTML=a.length?a.map(x=>card(x)).join(''):'<div>No products available yet.</div>'}function card(x){return `<article class="card" id="${x.id}"><img class="main" src="${x.images[0].src}" onclick="zoom.src=this.src;modal.classList.add('open')"><div class="thumbs">${x.images.map((im,i)=>`<img src="${im.src}" onclick="this.closest('.card').querySelector('.main').src=this.src">`).join('')}</div><div class="info"><div class="price">Price ₹${x.price}</div><div class="line">${esc(c.fabric)}</div><div class="line">${esc(c.sizes)}</div><div class="desc">${esc(x.description)}</div><div class="actions"><button class="btn order" onclick="order('${x.id}')">Order Now</button><button class="btn" onclick="this.textContent=this.textContent.includes('♡')?'♥ Liked':'♡ Like'">♡ Like</button><button class="btn" onclick="downloadP('${x.id}')">Download</button><button class="btn share" onclick="shareP('${x.id}')">Share</button></div></div></article>`}function order(id){let x=p.find(y=>y.id===id),m=`Hello Fancy Unlimited Collection, I want to order this product.%0AProduct No: ${encodeURIComponent(x.id)}%0AProduct: ${encodeURIComponent(x.title)}%0APrice: ₹${x.price}%0AImage: ${encodeURIComponent(x.images[0].src)}`;open(`https://wa.me/${c.whatsapp}?text=${m}`,'_blank')}async function downloadP(id){let x=p.find(y=>y.id===id),b=await (await fetch(x.images[0].src)).blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=id+'.jpg';a.click()}async function shareP(id){let x=p.find(y=>y.id===id);if(navigator.share)navigator.share({title:x.title,text:'₹'+x.price,url:location.href+'#'+id});else navigator.clipboard.writeText(location.href+'#'+id)}search.oninput=render;init();</script></body></html>
