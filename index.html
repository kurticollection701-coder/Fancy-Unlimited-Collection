<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Fancy Unlimited Collection</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#667085;--accent:#111827;--line:#e5e7eb;--green:#16a34a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
a{text-decoration:none;color:inherit}.hero{background:#111827;color:#fff}.cover{height:270px;background:#222 center/cover no-repeat;position:relative}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.48))}
.profileWrap{max-width:1100px;margin:-68px auto 0;padding:0 18px;position:relative;z-index:2;display:flex;gap:18px;align-items:flex-end}.avatar{width:136px;height:136px;border-radius:50%;border:6px solid white;object-fit:cover;background:#fff;box-shadow:0 5px 20px #0003}.brand h1{margin:0 0 4px;font-size:30px}.brand p{margin:0 0 12px;color:#e5e7eb}.bio{max-width:1100px;margin:0 auto;padding:14px 18px 24px;color:#e5e7eb;line-height:1.55}.toolbar{max-width:1100px;margin:18px auto;padding:0 18px;display:flex;gap:10px;flex-wrap:wrap}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;font-size:15px}.grid{max-width:1100px;margin:0 auto;padding:0 18px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 3px 12px #0000000d}.mainImg{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;cursor:zoom-in;background:#eee}.thumbs{display:flex;gap:6px;padding:8px;overflow:auto}.thumbs img{width:52px;height:62px;object-fit:cover;border-radius:7px;cursor:pointer;border:2px solid transparent}.thumbs img.active{border-color:#111827}.info{padding:12px}.price{font-size:20px;font-weight:800;margin-bottom:7px}.spec{font-weight:700;margin:4px 0}.desc{color:#475467;line-height:1.45;min-height:58px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.btn{border:0;border-radius:10px;padding:11px 8px;font-weight:700;cursor:pointer;background:#eef2f7}.order{background:#16a34a;color:white}.liked{background:#fee2e2}.share{grid-column:span 2}.empty{text-align:center;grid-column:1/-1;padding:50px;color:var(--muted)}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:99;padding:18px}.modal.open{display:flex}.modal img{max-width:96vw;max-height:92vh;object-fit:contain}.close{position:fixed;top:16px;right:18px;color:white;font-size:32px;cursor:pointer}.adminLink{margin-left:auto;color:#cbd5e1;font-size:13px}.notice{max-width:1100px;margin:0 auto 16px;padding:0 18px;color:#667085;font-size:13px}
@media(max-width:600px){.cover{height:205px}.profileWrap{margin-top:-48px}.avatar{width:100px;height:100px}.brand h1{font-size:22px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));padding:0 10px 30px;gap:10px}.toolbar{padding:0 10px}.card{border-radius:12px}.info{padding:9px}.actions{grid-template-columns:1fr}.share{grid-column:auto}}
</style>
<script src="data.js"></script>
</head>
<body>
<header class="hero">
  <div id="cover" class="cover"></div>
  <div class="profileWrap">
    <img id="profile" class="avatar" alt="Fancy Unlimited Collection profile">
    <div class="brand">
      <h1 id="siteName">Fancy Unlimited Collection</h1>
      <p>Fashion • Kids Clothing • Kurtis</p>
    </div>
    <a class="adminLink" href="admin.html">Admin Login</a>
  </div>
  <div id="bio" class="bio"></div>
</header>

<div class="toolbar">
  <input id="search" placeholder="Search products..." aria-label="Search products">
  <select id="sort"><option value="new">Newest first</option><option value="price">Price</option><option value="name">Name</option></select>
</div>
<div class="notice">Each product can contain multiple angles. Duplicate product images are automatically filtered from the public list.</div>
<main id="grid" class="grid"></main>

<div id="modal" class="modal" onclick="closeZoom()"><span class="close">×</span><img id="zoomImg" alt="Product preview"></div>

<script>
const DB_NAME="fuc_store_v1", STORE="app";
let state=null, products=[];
function req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function db(){return new Promise((res,rej)=>{let r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function get(k){let d=await db();return req(d.transaction(STORE).objectStore(STORE).get(k))}
async function save(k,v){let d=await db();return req(d.transaction(STORE,"readwrite").objectStore(STORE).put(v,k))}
async function load(){state=await get("settings")||structuredClone(window.FUC_DEFAULT_DATA);products=await get("products")||state.products||[];document.getElementById("cover").style.backgroundImage=`url("${state.coverImage}")`;document.getElementById("profile").src=state.profileImage;document.getElementById("siteName").textContent=state.siteName;document.getElementById("bio").textContent=state.bio;render()}
function dedupe(arr){const seen=new Set();return arr.filter(p=>{const key=(p.images||[]).map(x=>x.hash||x.src.slice(0,120)).join("|");if(seen.has(key))return false;seen.add(key);return true})}
function render(){let q=document.getElementById("search").value.toLowerCase(), s=document.getElementById("sort").value;let arr=dedupe(products).filter(p=>(p.title+" "+p.description).toLowerCase().includes(q));if(s==="price")arr.sort((a,b)=>a.price-b.price);if(s==="name")arr.sort((a,b)=>a.title.localeCompare(b.title));document.getElementById("grid").innerHTML=arr.length?arr.map(card).join(""):`<div class="empty">No products available yet. Please check back soon.</div>`}
function card(p){let id=escapeHtml(p.id), src=p.images?.[0]?.src||"";return `<article class="card" data-id="${id}"><img class="mainImg" src="${src}" alt="${escapeHtml(p.title)}" onclick="zoom('${id}',0)"><div class="thumbs">${(p.images||[]).slice(0,10).map((x,i)=>`<img class="${i===0?"active":""}" src="${x.src}" alt="Angle ${i+1}" onclick="changeImg('${id}',${i},this)">`).join("")}</div><div class="info"><div class="price">Price ₹${Number(p.price||560).toLocaleString("en-IN")}</div><div class="spec">Fiber Cotton</div><div class="spec">All size available ✅</div><div class="desc">${escapeHtml(p.description||"Beautiful design with quality fabric and comfortable finish.")}</div><div class="actions"><button class="btn order" onclick="order('${id}')">Order Now</button><button class="btn" onclick="like('${id}',this)">♡ Like</button><button class="btn" onclick="downloadImg('${id}')">Download</button><button class="btn share" onclick="shareProduct('${id}')">Share</button></div></div></article>`}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function find(id){return products.find(p=>p.id===id)}
function changeImg(id,i,el){let p=find(id),c=el.closest(".card");c.querySelector(".mainImg").src=p.images[i].src;c.querySelectorAll(".thumbs img").forEach(x=>x.classList.remove("active"));el.classList.add("active")}
function zoom(id,i){let p=find(id);document.getElementById("zoomImg").src=p.images[i].src;document.getElementById("modal").classList.add("open")}
function closeZoom(){document.getElementById("modal").classList.remove("open")}
function order(id){let p=find(id), msg=`Hello Fancy Unlimited Collection, I want to order this product.%0AProduct No: ${encodeURIComponent(p.id)}%0AProduct: ${encodeURIComponent(p.title)}%0APrice: ₹${p.price}%0AProduct image: ${encodeURIComponent(p.images?.[0]?.src||"")}`;window.open(`https://wa.me/${state.whatsapp}?text=${msg}`,"_blank")}
function like(id,b){let key="fuc_likes";let a=JSON.parse(localStorage.getItem(key)||"[]");if(a.includes(id)){a=a.filter(x=>x!==id);b.classList.remove("liked");b.textContent="♡ Like"}else{a.push(id);b.classList.add("liked");b.textContent="♥ Liked"}localStorage.setItem(key,JSON.stringify(a))}
async function downloadImg(id){let p=find(id);let r=await fetch(p.images[0].src);let b=await r.blob();let u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=`${p.id}.jpg`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function shareProduct(id){let p=find(id),text=`${p.title} - ₹${p.price}`;if(navigator.share)await navigator.share({title:p.title,text,url:location.href+"#"+p.id});else await navigator.clipboard.writeText(text+" "+location.href+"#"+p.id)}
document.getElementById("search").oninput=render;document.getElementById("sort").onchange=render;load();
</script>
</body></html>
