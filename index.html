<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./data.js?v=3"></script>
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fancy Unlimited Collection</title>
<meta name="description" content="Fancy Unlimited Collection - Kurtis and kids clothing">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#111827;font-family:Arial,sans-serif}.cover{height:270px;background:#e5e7eb center/cover no-repeat;position:relative}.admin{position:absolute;right:14px;top:12px;color:#fff;background:#0008;padding:8px 11px;border-radius:9px;text-decoration:none;font-weight:700}.head{max-width:1120px;margin:-62px auto 0;position:relative;padding:0 16px}.top{display:flex;align-items:end;gap:15px}.avatar{width:128px;height:128px;border-radius:50%;border:6px solid #fff;object-fit:cover;background:#fff;display:block}.name{font-size:29px;font-weight:800;color:#fff;text-shadow:0 2px 5px #000;margin-bottom:12px}.bio{padding:15px 0;line-height:1.5;font-weight:600;font-size:14px}.status{max-width:1120px;margin:0 auto;padding:0 16px 5px;color:#667085;font-size:13px}.status.error{color:#b42318}.tools{max-width:1120px;margin:10px auto;padding:0 16px}.tools input{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:12px;font-size:16px;background:#fff}.grid{max-width:1120px;margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;padding:10px 16px 40px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px #0000000a}.main{width:100%;height:auto;aspect-ratio:4/5;object-fit:contain;background:#fff;display:block;cursor:zoom-in}.thumbs{display:flex;gap:5px;overflow:auto;padding:7px}.thumbs img{width:48px;height:58px;object-fit:contain;background:#fff;border:1px solid #eee;border-radius:6px;cursor:pointer}.info{padding:10px}.price{font-size:18px;font-weight:800}.line{margin-top:5px;font-weight:600}.desc{white-space:pre-line;margin-top:6px;color:#667085;line-height:1.35;font-size:11px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.btn{border:0;border-radius:9px;padding:10px;font-weight:700;background:#eef1f5;cursor:pointer}.order{background:#16a34a;color:#fff}.share{grid-column:1/-1}.empty{grid-column:1/-1;background:#fff;padding:30px;border-radius:12px;text-align:center;color:#667085}.modal{display:none;position:fixed;inset:0;background:#000c;z-index:99;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.modal img{max-width:96%;max-height:92%;object-fit:contain}.modal .close{position:absolute;right:14px;top:10px;color:#fff;font-size:34px;cursor:pointer}@media(max-width:600px){.cover{height:205px}.avatar{width:105px;height:105px}.name{font-size:20px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:10px 8px 30px}.tools{padding:0 8px}.head{padding:0 10px}.bio{font-size:13px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./data.js?v=20260923"></script>
</head>
<body>
<div id="cover" class="cover"><a class="admin" href="./admin.html">Admin Login</a></div>
<div class="head"><div class="top"><img id="avatar" class="avatar" alt="Profile"><div id="site" class="name">Fancy Unlimited Collection</div></div><div id="bio" class="bio"></div></div>
<div id="status" class="status">Loading store...</div>
<div class="tools"><input id="search" type="search" placeholder="Search products..." autocomplete="off"></div>
<main id="grid" class="grid"></main>
<div id="modal" class="modal"><span class="close" id="close">×</span><img id="zoom" alt="Product image"></div>
<script>
(function(){
"use strict";
const CFG=window.FUC_SUPABASE||{};const DEF=window.FUC_DEFAULT_DATA||{};
const $=id=>document.getElementById(id);const cover=$("cover"),avatar=$("avatar"),site=$("site"),bio=$("bio"),status=$("status"),search=$("search"),grid=$("grid"),modal=$("modal"),zoom=$("zoom");
let settings={siteName:DEF.siteName||"Fancy Unlimited Collection",whatsapp:DEF.whatsapp||"9119392297",bio:DEF.bio||"",fabric:DEF.fabric||"Fiber Cotton",sizes:DEF.sizes||"All size available ✅",coverImage:DEF.coverImage||"",profileImage:DEF.profileImage||""};let products=[];let client=null;
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function normImages(a){return Array.isArray(a)?a.map(v=>typeof v==="string"?{src:v}:(v&&v.src?{src:String(v.src)}:null)).filter(Boolean).slice(0,10):[]}
function norm(p){return{id:String(p?.id??""),title:String(p?.title||"Kids dress"),price:Number(p?.price??560),description:String(p?.description||""),images:normImages(p?.images)}}
function setStatus(t,err=false){status.textContent=t||"";status.className="status"+(err?" error":"")}
function apply(){site.textContent=settings.siteName;bio.textContent=settings.bio;if(settings.coverImage)cover.style.backgroundImage='url("'+String(settings.coverImage).replace(/"/g,'\\"')+'")';if(settings.profileImage)avatar.src=settings.profileImage;else avatar.removeAttribute("src")}
function render(){const q=search.value.trim().toLowerCase();const list=products.filter(p=>(p.id+" "+p.title+" "+p.description).toLowerCase().includes(q));if(!list.length){grid.innerHTML='<div class="empty">No products available yet.</div>';return}grid.innerHTML=list.map(card).join("")}
function card(p){const imgs=p.images||[];const first=imgs[0]?.src||"";const thumbs=imgs.map((im,i)=>'<img src="'+esc(im.src)+'" alt="" data-p="'+esc(p.id)+'" data-i="'+i+'">').join("");return '<article class="card" data-id="'+esc(p.id)+'"><img class="main" src="'+esc(first)+'" alt="'+esc(p.title)+'" data-zoom="1"><div class="thumbs">'+thumbs+'</div><div class="info"><div class="price">Price ₹'+Number(p.price||0).toLocaleString('en-IN')+'</div><div class="line">'+esc(settings.fabric)+'</div><div class="line">'+esc(settings.sizes)+'</div><div class="desc">'+esc(p.description)+'</div><div class="actions"><button class="btn order" data-order="'+esc(p.id)+'">Order Now</button><button class="btn" data-like="1">♡ Like</button><button class="btn" data-download="'+esc(p.id)+'">Download</button><button class="btn share" data-share="'+esc(p.id)+'">Share</button></div></div></article>'}
grid.addEventListener("click",async e=>{const thumb=e.target.closest(".thumbs img");if(thumb){const c=thumb.closest(".card");const main=c?.querySelector(".main");if(main)main.src=thumb.src;return}const main=e.target.closest(".main");if(main){zoom.src=main.src;modal.classList.add("open");return}const like=e.target.closest("[data-like]");if(like){like.textContent=like.textContent.includes("♡")?"♥ Liked":"♡ Like";return}const order=e.target.closest("[data-order]");if(order){orderNow(order.dataset.order);return}const dl=e.target.closest("[data-download]");if(dl){downloadProduct(dl.dataset.download);return}const sh=e.target.closest("[data-share]");if(sh){shareProduct(sh.dataset.share);return}});
function orderNow(id){const p=products.find(x=>x.id===id);if(!p)return;const n=String(settings.whatsapp).replace(/\D/g,"");if(!n)return alert("WhatsApp number is not configured.");const msg="Dress No: "+p.id+"\nProduct Name: "+p.title;window.open("https://wa.me/"+n+"?text="+encodeURIComponent(msg),"_blank","noopener")}
async function downloadProduct(id){const p=products.find(x=>x.id===id),src=p?.images?.[0]?.src;if(!src)return alert("No product photo available.");try{const r=await fetch(src);if(!r.ok)throw new Error("download failed");const b=await r.blob();const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=id+".jpg";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}catch(e){window.open(src,"_blank","noopener")}}
async function shareProduct(id){const p=products.find(x=>x.id===id);if(!p)return;const url=location.href.split("#")[0]+"#product-"+encodeURIComponent(id);try{if(navigator.share){await navigator.share({title:p.title,text:"Dress No: "+p.id+"\nProduct Name: "+p.title,url})}else{await navigator.clipboard.writeText(url);setStatus("Product link copied.")}}catch(e){}}
$("close").onclick=()=>modal.classList.remove("open");modal.onclick=e=>{if(e.target===modal)modal.classList.remove("open")};search.oninput=render;
async function loadOnline(){const valid=CFG.url&&CFG.key;if(!valid)throw new Error("Supabase configuration is missing in data.js.");if(!window.supabase?.createClient)throw new Error("Supabase library did not load.");client=window.supabase.createClient(CFG.url,CFG.key);const req=Promise.all([client.from("settings").select("*").eq("id",1).maybeSingle(),client.from("products").select("*").order("created_at",{ascending:false})]);const result=await Promise.race([req,new Promise((_,rej)=>setTimeout(()=>rej(new Error("Online store request timed out.")),12000))]);if(result[0].error)throw result[0].error;if(result[1].error)throw result[1].error;const s=result[0].data;if(s){settings.siteName=s.site_name||settings.siteName;settings.whatsapp=s.whatsapp||settings.whatsapp;settings.bio=s.bio||settings.bio;settings.coverImage=s.cover_url||settings.coverImage;settings.profileImage=s.profile_url||settings.profileImage}products=(result[1].data||[]).map(norm);apply();render();setStatus(products.length?products.length+" product"+(products.length===1?"":"s")+" loaded.":"Store is ready. No products have been added yet.")}
async function init(){apply();products=Array.isArray(DEF.products)?DEF.products.map(norm):[];render();try{await loadOnline()}catch(e){console.error(e);apply();render();setStatus("Online store could not be loaded: "+(e.message||e),true)}}
init();
})();
</script>
</body></html>
